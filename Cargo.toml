[package]
name = "remote-run"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.2"

# `rr fwd` must end its ssh when `rr` is killed: prctl(PR_SET_PDEATHSIG) is Linux only, and the
# signal flags (SIGINT/SIGTERM/SIGHUP) are Unix only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[[bin]]
name = "rr"
path = "src/main.rs"

# The library is the functional core: it neither prints nor panics on a bad value. `main.rs` and
# the adapters opt out where printing or process access is their job.
[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"
