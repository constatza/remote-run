name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # the advisory database changes without a commit here
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # the same three commands as the local gate in the README and `.pre-commit-config.yaml`
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # `tests/snapshot.rs` needs git and `tests/fwd.rs` needs python3; both ship with the runner
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
